<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self' https:; upgrade-insecure-requests">
    <title>在线随机选号器 - SecNN</title>
	<meta name="description" content="免费在线生成大乐透、双色球和 3D 等彩票随机号码，支持多组号码生成与基础统计展示，仅供娱乐参考。">
    <link rel="stylesheet" href="../assets/subpage-polish.css?v=1">
	<meta name="keywords" content="大乐透随机选号,双色球随机选号,彩票号码生成,七乐彩,福彩3D,排列3,娱乐工具">
    <style>
        :root {
            --primary: #e11d48;
            --secondary: #059669;
            --blue: #2563eb;
            --dark: #172033;
            --light: #f8fafc;
            --gray: #64748b;
            --line: #e2e8f0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: radial-gradient(circle at 12% 8%, rgba(8,145,178,.08), transparent 28rem), radial-gradient(circle at 88% 22%, rgba(37,99,235,.06), transparent 26rem), #fff;
            color: var(--dark);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin: 20px 0 30px;
            padding: 2rem 1.25rem;
            background-color: white;
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(15,23,42,.07);
        }
        
        h1 {
            color: var(--primary);
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: var(--gray);
            font-size: 15px;
            line-height: 1.7;
        }
        
        .card {
            background-color: white;
            border-radius: 12px;
            border: 1px solid var(--line);
            box-shadow: 0 10px 28px rgba(15,23,42,.07);
            padding: 25px;
            margin-bottom: 25px;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .lottery-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #ff6b81;
            transform: translateY(-2px);
        }
        
        .btn-active {
            background: linear-gradient(135deg, #0891b2, #2563eb);
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .btn-other {
            background-color: var(--blue);
            color: white;
        }
        
        .btn-other:hover {
            background-color: #70a1ff;
        }
        
        .bet-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: var(--light);
            padding: 8px 15px;
            border-radius: 6px;
        }
        
        .bet-control span {
            font-weight: 500;
        }
        
        input[type="number"] {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            width: 60px;
            text-align: center;
            font-weight: bold;
        }
        
        .rules {
            padding: 15px;
            background-color: var(--light);
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            color: #475569;
            border-left: 4px solid #0891b2;
        }
        
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .results-heading { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:15px; }
        .results-heading h2 { margin:0; }
        
        .result-card {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid var(--line);
            box-shadow: 0 4px 12px rgba(15,23,42,.05);
            transition: transform 0.3s ease;
        }
        
        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        
        .result-title {
            font-size: 15px;
            color: var(--dark);
            margin-bottom: 10px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .result-title .copy-btn {
            background-color: transparent;
            border: none;
            color: var(--blue);
            cursor: pointer;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 4px;
        }
        
        .balls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .ball {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            position: relative;
            box-shadow: inset 0 -2px 4px rgba(0,0,0,.12);
        }
        
        .red-ball {
            background-color: var(--primary);
        }
        
        .blue-ball {
            background-color: var(--blue);
        }
        
        .green-ball {
            background-color: var(--secondary);
        }
        
        .yellow-ball {
            background-color: #ffa502;
        }
        
        .divider {
            margin: 0 5px;
            color: var(--gray);
            font-weight: bold;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: var(--gray);
            font-size: 13px;
            line-height: 1.6;
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .lottery-selector {
                width: 100%;
            }
            
            .results {
                grid-template-columns: 1fr;
            }

            body { padding: 8px; }
            .container { width: 100%; }
            .card { padding: 1rem; }
            .lottery-selector .btn { flex: 1 1 calc(50% - 10px); }
            .bet-control { width: 100%; flex-wrap: wrap; }
            .bet-control .btn { flex: 1; }
        }
        
        /* 动画效果 */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        .ball:hover {
            animation: bounce 0.5s;
        }
    </style>
</head>
<body>
    <nav class="secnn-page-nav" aria-label="页面导航"><span class="secnn-page-nav__brand">SecNN · 随机选号</span><a class="secnn-page-nav__home" href="../index.html">← 返回主页</a></nav>
    <div class="container">
        <header>
            <h1>在线随机选号器</h1>
            <p class="subtitle">支持大乐透、双色球、七乐彩、福彩 3D 和排列 3，多组号码均在浏览器本地生成。</p>
			<p class="subtitle">随机结果不构成预测或投注建议。彩票有风险，请理性参与。</p>

        </header>
        
        <div class="card">
            <div class="controls">
                <div class="lottery-selector">
                    <button type="button" id="dlt-btn" class="btn btn-primary btn-active" aria-pressed="true" onclick="setLottery('dlt')">大乐透</button>
                    <button type="button" id="ssq-btn" class="btn btn-primary" aria-pressed="false" onclick="setLottery('ssq')">双色球</button>
                    <button type="button" id="qlc-btn" class="btn btn-other" aria-pressed="false" onclick="setLottery('qlc')">七乐彩</button>
                    <button type="button" id="3d-btn" class="btn btn-other" aria-pressed="false" onclick="setLottery('3d')">福彩 3D</button>
                    <button type="button" id="p3-btn" class="btn btn-other" aria-pressed="false" onclick="setLottery('p3')">排列 3</button>
                </div>
                
                <div class="bet-control">
                    <label for="bet-count">生成组数：</label>
                    <input type="number" id="bet-count" min="1" max="20" value="5">
                    <button type="button" class="btn btn-primary" onclick="generateNumbers()">重新生成</button>
                </div>
            </div>
            
            <div class="rules" id="rules" aria-live="polite">
                大乐透规则：前区从1-35中选择5个号码，后区从1-12中选择2个号码
            </div>
        </div>
        
        <div class="card">
            <div class="results-heading"><h2>随机号码结果</h2><button type="button" id="copy-all" class="btn btn-other" onclick="copyAllResults(this)">复制全部</button></div>
            <div class="results" id="results" aria-live="polite">
                <!-- 结果将在这里显示 -->
            </div>
        </div>
        
        <div class="footer">
            <p>免责声明：本工具仅提供随机选号功能，不保证中奖，请理性购彩</p>
            <p>本工具仅供娱乐，请勿沉迷博彩</p>
        </div>
    </div>

    <script>
        let currentLottery = 'dlt';
        const lotteryRules = {
            'dlt': '大乐透规则：前区从1-35中选择5个号码，后区从1-12中选择2个号码',
            'ssq': '双色球规则：红球从1-33中选择6个号码，蓝球从1-16中选择1个号码',
            'qlc': '七乐彩规则：从1-30中选择7个基本号码和1个特别号码',
            '3d': '福彩3D规则：从0-9中各选1个号码组成百、十、个位',
            'p3': '排列3规则：从0-9中各选1个号码组成百、十、个位'
        };
        
        // 设置当前彩票类型
        function setLottery(type) {
            currentLottery = type;
            
            // 更新按钮状态
            document.querySelectorAll('.lottery-selector button').forEach(btn => {
                btn.classList.remove('btn-active');
                btn.setAttribute('aria-pressed', 'false');
            });
            const activeButton = document.getElementById(`${type}-btn`);
            activeButton.classList.add('btn-active');
            activeButton.setAttribute('aria-pressed', 'true');
            
            // 更新规则说明
            document.getElementById('rules').textContent = lotteryRules[type];
            
            // 清空结果
            document.getElementById('results').innerHTML = '';
        }
        
        // 生成随机号码
        function generateNumbers() {
            const betInput = document.getElementById('bet-count');
            const parsedCount = Number.parseInt(betInput.value, 10);
            const betCount = Number.isFinite(parsedCount) ? Math.min(20, Math.max(1, parsedCount)) : 1;
            betInput.value = betCount;
            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = '';
            
            for (let i = 1; i <= betCount; i++) {
                let numbers;
                let title;
                let type = currentLottery;
                
                switch(currentLottery) {
                    case 'dlt':
                        // 大乐透: 前区5个(1-35), 后区2个(1-12)
                        const front = generateUniqueRandom(1, 35, 5).sort((a, b) => a - b);
                        const back = generateUniqueRandom(1, 12, 2).sort((a, b) => a - b);
                        numbers = { front, back };
                        title = `大乐透 ${i}`;
                        break;
                        
                    case 'ssq':
                        // 双色球: 红球6个(1-33), 蓝球1个(1-16)
                        const red = generateUniqueRandom(1, 33, 6).sort((a, b) => a - b);
                        const blue = generateUniqueRandom(1, 16, 1);
                        numbers = { red, blue };
                        title = `双色球 ${i}`;
                        break;
                        
                    case 'qlc':
                        // 七乐彩: 7个基本号(1-30), 1个特别号(1-30)
                        const basic = generateUniqueRandom(1, 30, 7).sort((a, b) => a - b);
                        let special;
                        do {
                            special = randomInt(1, 30);
                        } while (basic.includes(special));
                        numbers = { basic, special };
                        title = `七乐彩 ${i}`;
                        break;
                        
                    case '3d':
                    case 'p3':
                        // 福彩3D/排列3: 每位一个数字(0-9)
                        const hundred = randomInt(0, 9);
                        const ten = randomInt(0, 9);
                        const unit = randomInt(0, 9);
                        numbers = { hundred, ten, unit };
                        title = currentLottery === '3d' ? `福彩3D ${i}` : `排列3 ${i}`;
                        break;
                }
                
                createResultCard(title, numbers, type);
            }
        }
        
        // 创建结果卡片
        function createResultCard(title, numbers, type) {
            const resultsContainer = document.getElementById('results');
            const card = document.createElement('div');
            card.className = 'result-card';
            
            // 创建卡片HTML
            let html = `
                <div class="result-title">
                    ${title}
                    <button class="copy-btn" onclick="copyResult(this)">复制</button>
                </div>
                <div class="balls">
            `;
            
            switch(type) {
                case 'dlt':
                    // 大乐透显示
                    numbers.front.forEach(num => {
                        html += `<div class="ball red-ball">${formatNumber(num)}</div>`;
                    });
                    
                    html += `<div class="divider">|</div>`;
                    
                    numbers.back.forEach(num => {
                        html += `<div class="ball blue-ball">${formatNumber(num)}</div>`;
                    });
                    break;
                    
                case 'ssq':
                    // 双色球显示
                    numbers.red.forEach(num => {
                        html += `<div class="ball red-ball">${formatNumber(num)}</div>`;
                    });
                    
                    html += `<div class="divider">|</div>`;
                    
                    html += `<div class="ball blue-ball">${formatNumber(numbers.blue)}</div>`;
                    break;
                    
                case 'qlc':
                    // 七乐彩显示
                    numbers.basic.forEach(num => {
                        html += `<div class="ball red-ball">${formatNumber(num)}</div>`;
                    });
                    
                    html += `<div class="divider">+</div>`;
                    
                    html += `<div class="ball green-ball">${formatNumber(numbers.special)}</div>`;
                    break;
                    
                case '3d':
                case 'p3':
                    // 福彩3D/排列3显示
                    html += `<div class="ball yellow-ball">${numbers.hundred}</div>`;
                    html += `<div class="ball yellow-ball">${numbers.ten}</div>`;
                    html += `<div class="ball yellow-ball">${numbers.unit}</div>`;
                    break;
            }
            
            html += `</div>`;
            card.innerHTML = html;
            
            // 存储原始数据以便复制
            card.dataset.numbers = JSON.stringify(numbers);
            card.dataset.type = type;
            
            resultsContainer.appendChild(card);
        }
        
        // 生成不重复的随机数
        function generateUniqueRandom(min, max, count) {
            const numbers = new Set();

            while (numbers.size < count) {
                numbers.add(randomInt(min, max));
            }
            
            return Array.from(numbers);
        }

        // 优先使用浏览器加密随机源；不支持时退回 Math.random。
        function randomInt(min, max) {
            const range = max - min + 1;
            if (window.crypto && window.crypto.getRandomValues) {
                const limit = Math.floor(0x100000000 / range) * range;
                const value = new Uint32Array(1);
                do {
                    window.crypto.getRandomValues(value);
                } while (value[0] >= limit);
                return min + (value[0] % range);
            }
            return min + Math.floor(Math.random() * range);
        }
        
        // 格式化数字显示
        function formatNumber(num) {
            return num.toString().padStart(2, '0');
        }
        
        // 复制结果
        function copyResult(btn) {
            const card = btn.closest('.result-card');
            const numbers = JSON.parse(card.dataset.numbers);
            const type = card.dataset.type;
            
            let text = '';
            
            switch(type) {
                case 'dlt':
                    text = numbers.front.join(',') + ' | ' + numbers.back.join(',');
                    break;
                    
                case 'ssq':
                    text = numbers.red.join(',') + ' | ' + numbers.blue;
                    break;
                    
                case 'qlc':
                    text = numbers.basic.join(',') + ' + ' + numbers.special;
                    break;
                    
                case '3d':
                case 'p3':
                    text = numbers.hundred + ' ' + numbers.ten + ' ' + numbers.unit;
                    break;
            }
            
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '已复制!';
                setTimeout(() => {
                    btn.textContent = '复制';
                }, 2000);
            }).catch(() => {
                btn.textContent = '复制失败';
                setTimeout(() => { btn.textContent = '复制'; }, 2000);
            });
        }

        function formatResult(numbers, type) {
            if (type === 'dlt') return numbers.front.join(',') + ' | ' + numbers.back.join(',');
            if (type === 'ssq') return numbers.red.join(',') + ' | ' + numbers.blue;
            if (type === 'qlc') return numbers.basic.join(',') + ' + ' + numbers.special;
            return numbers.hundred + ' ' + numbers.ten + ' ' + numbers.unit;
        }

        function copyAllResults(btn) {
            const rows = Array.from(document.querySelectorAll('.result-card')).map((card, index) => {
                const numbers = JSON.parse(card.dataset.numbers);
                return `${index + 1}. ${formatResult(numbers, card.dataset.type)}`;
            });
            if (!rows.length) return;
            navigator.clipboard.writeText(rows.join('\n')).then(() => {
                btn.textContent = '已复制全部';
                setTimeout(() => { btn.textContent = '复制全部'; }, 1800);
            }).catch(() => {
                btn.textContent = '复制失败';
                setTimeout(() => { btn.textContent = '复制全部'; }, 1800);
            });
        }
        
        // 页面加载时默认生成一次
        window.onload = generateNumbers;
    </script>
<script src="../assets/site-footer.js?v=1"></script>
</body>
</html>
