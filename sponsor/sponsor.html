<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self' https:; upgrade-insecure-requests">
    <title>支持 SecNN - 项目赞助与鸣谢</title>
    <meta name="description" content="SecNN 项目支持与打赏信息，感谢社区用户对免费网络安全工具持续开发与维护的支持。">
    <link rel="stylesheet" href="../assets/subpage-polish.css?v=1">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #0891b2;
            --dark-bg: #ffffff;
            --card-bg: #ffffff;
            --text-color: #172033;
            --muted-color: #64748b;
            --accent-color: #2563eb;
            --hover-color: #0e7490;
            --line-color: #e2e8f0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: radial-gradient(circle at 12% 8%, rgba(8,145,178,.08), transparent 28rem), radial-gradient(circle at 88% 22%, rgba(37,99,235,.06), transparent 26rem), var(--dark-bg);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            flex: 1;
        }
        
        header {
            text-align: center;
            margin-bottom: 2rem;
            padding-top: 20px;
        }
        
        .logo {
            max-width: 150px;
            height: auto;
            margin-bottom: 1rem;
        }
        
        .site-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .site-description {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 800px;
            margin: 0 auto 2rem;
            color: var(--muted-color);
        }
        
        /* 打赏卡片区 */
        .donation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }
        
        .donation-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 2rem;
            transition: all 0.3s ease;
            border: 1px solid var(--line-color);
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.07);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .donation-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 38px rgba(15, 23, 42, 0.12);
            border-color: var(--primary-color);
        }
        
        .donation-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }
        
        .donation-title {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }
        
        .donation-desc {
            font-size: 0.95rem;
            opacity: 0.8;
            margin-bottom: 1.5rem;
            color: var(--muted-color);
        }
        
        .qrcode-image {
            width: 220px;
            height: 220px;
            margin: 0 auto 1.5rem;
            border-radius: 10px;
            padding: 8px;
            background: #fff;
            border: 1px solid var(--line-color);
            transition: all 0.3s;
        }
        
        .qrcode-image:hover {
            transform: scale(1.05);
            border-color: var(--primary-color);
        }
        
        .donation-note {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-top: 1.5rem;
            font-style: italic;
            color: var(--muted-color);
        }
        
        /* 感谢区域 */
        .thanks-section {
            background: linear-gradient(135deg, rgba(74, 144, 226, 0.15), rgba(91, 33, 182, 0.15));
            border-radius: 12px;
            padding: 2rem;
            margin-top: 2rem;
            border: 1px solid rgba(74, 144, 226, 0.5);
            text-align: center;
        }
        
        .thanks-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }
        
        .thanks-text {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 1rem;
        }
        
        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--muted-color);
            background-color: #f8fafc;
            border-top: 1px solid var(--line-color);
            margin-top: auto;
        }
        
        .footer-text {
            font-size: 0.9rem;
            opacity: 0.7;
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .site-title {
                font-size: 2rem;
            }
            
            .donation-grid {
                grid-template-columns: 1fr;
            }
        }
		/* 赞助 */
		.sponsors-grid {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 0;
            overflow: hidden;
            position: relative;
        }
        
        .carousel-container {
            position: relative;
            margin: 0 30px;
            overflow: hidden;
            padding: 1.5rem;
            background: #f8fafc;
            border: 1px solid var(--line-color);
            border-radius: 18px;
        }
        
        .carousel-track {
            display: flex;
            gap: 12px;
            transition: transform 0.4s ease;
            padding: 5px 0;
        }
        
        .sponsor-card {
            min-width: calc(16.666% - 11px); /* 6列布局 */
            flex-shrink: 0;
            padding: 12px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s;
            border: 1px solid var(--line-color);
        }
        
        .sponsor-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
        }
        
        .sponsor-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 8px;
            border: 2px solid #ffe066;
        }
        
        .sponsor-info {
            width: 100%;
            text-align: center;
        }
        
        .sponsor-name {
            font-size: 12px;
            font-weight: bold;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 2px 0;
        }
        
        .sponsor-amount {
            font-size: 13px;
            color: #ff6b6b;
            font-weight: bold;
            margin: 3px 0 5px;
            white-space: nowrap;
        }
        
        .sponsor-message {
            font-size: 11px;
            color: #666;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 28px;
            margin-top: 4px;
            padding-top: 3px;
            border-top: 1px dashed #eee;
        }
        
        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            background: white;
            border: none;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
        }
        
        .carousel-nav:hover {
            background: var(--primary-color);
            color: white;
        }
        
        .carousel-prev {
            left: 0;
        }
        
        .carousel-next {
            right: 0;
        }

        .support-eyebrow { display:inline-flex; padding:.35rem .75rem; color:var(--primary-color); background:#ecfeff; border:1px solid #a5f3fc; border-radius:999px; font-size:.82rem; font-weight:700; }
        .sponsors-heading { text-align:center; margin-bottom:1.25rem; }
        .sponsors-heading h2 { margin-bottom:.35rem; }
        .sponsors-heading p { color:var(--muted-color); font-size:.92rem; }
        .footer-text a { color:var(--primary-color); text-decoration:none; }
        @media (min-width:1200px) and (max-width:1399px) { .sponsor-card { min-width:calc(20% - 10px); } }
        @media (max-width:1199px) { .sponsor-card { min-width:calc(25% - 9px); } }
        @media (max-width:991px) { .sponsor-card { min-width:calc(33.333% - 8px); } }
        @media (max-width:767px) { .sponsor-card { min-width:calc(50% - 6px); } }
        @media (max-width:575px) { .sponsor-card { min-width:100%; } .carousel-container { margin:0 .5rem; padding:1rem 2.5rem; } .qrcode-image { width:min(220px,100%); height:auto; aspect-ratio:1; } }
    </style>
</head>
<body>
    <nav class="secnn-page-nav" aria-label="页面导航"><span class="secnn-page-nav__brand">SecNN · 项目支持</span><a class="secnn-page-nav__home" href="../index.html">← 返回主页</a></nav>
    <div class="container">
        <header>
            <span class="support-eyebrow">社区支持</span>
            <h1 class="site-title">支持 SecNN 持续维护</h1>
            <p class="site-description">
                SecNN 工具持续免费开放。你的支持将用于项目维护、服务资源和功能迭代；赞助完全自愿，不影响任何工具的正常使用。
            </p>
		</header>
        
        <main>
            <div class="donation-grid">
                <div class="donation-card">
                    <div class="donation-icon">
                        <i class="fab fa-weixin"></i>
                    </div>
                    <h3 class="donation-title">微信打赏</h3>
                    <p class="donation-desc">
                        扫描下方二维码，通过微信赞赏码支持我们
                    </p>
                    <img src="../img/wechat-donation.jpg" alt="微信打赏二维码" class="qrcode-image">
                    <p class="donation-note">
                        长按识别二维码 → 输入金额 → 添加备注(可选)
                    </p>
                </div>
                
                <div class="donation-card">
                    <div class="donation-icon">
                        <i class="fab fa-alipay"></i>
                    </div>
                    <h3 class="donation-title">支付宝打赏</h3>
                    <p class="donation-desc">
                        扫描下方二维码，通过支付宝支持我们
                    </p>
                    <img src="../img/alipay-donation.jpg" alt="支付宝打赏二维码" class="qrcode-image">
                    <p class="donation-note">
                        长按识别二维码 → 输入金额 → 添加备注(可选)
                    </p>
                </div>
            </div>
                        
        </main>
    </div>
    <div class="sponsors-grid">
        <div class="carousel-container">
		<div class="sponsors-heading"><h2>感谢每一份支持</h2><p>赞助名单按录入顺序展示，排名不分先后。</p></div>

            <button class="carousel-nav carousel-prev" type="button" aria-label="查看上一组赞助者">❮</button>
            <div class="carousel-track" id="carouselTrack"></div>
            <button class="carousel-nav carousel-next" type="button" aria-label="查看下一组赞助者">❯</button>
        </div>
    </div>
	<script src="../assets/sponsors.js?v=1"></script>
	<script>
        document.addEventListener('DOMContentLoaded', function() {
            // 赞助者数据
            const sponsors = window.SECNN_SPONSORS;

            const track = document.getElementById('carouselTrack');
            const prevBtn = document.querySelector('.carousel-prev');
            const nextBtn = document.querySelector('.carousel-next');
            let currentIndex = 0;
            let itemsPerView = 6;
            let cardWidth = 0;
            let autoScrollInterval;

            // 初始化轮播
            function initCarousel() {
                track.innerHTML = '';
                updateItemsPerView();
                
                sponsors.forEach(sponsor => {
                    const card = document.createElement('div');
                    card.className = 'sponsor-card';
                    card.innerHTML = `
                        <img src="${sponsor.avatar}" class="sponsor-avatar" loading="lazy"
                             alt="${sponsor.name}" 
                             onerror="this.style.visibility='hidden'">
                        <div class="sponsor-info">
                            <div class="sponsor-name">${sponsor.name}</div>
                            <div class="sponsor-amount">${sponsor.currency}${sponsor.amount}</div>
                            <div class="sponsor-message">${sponsor.message}</div>
                        </div>
                    `;
                    track.appendChild(card);
                });

                if(track.children.length > 0) {
                    cardWidth = track.children[0].offsetWidth + 12; // 包含gap
                }
                
                startAutoScroll();
            }

            // 更新可见项数量
            function updateItemsPerView() {
                const width = window.innerWidth;
                if(width >= 1400) itemsPerView = 6;
                else if(width >= 1200) itemsPerView = 5;
                else if(width >= 992) itemsPerView = 4;
                else if(width >= 768) itemsPerView = 3;
                else if(width >= 576) itemsPerView = 2;
                else itemsPerView = 1;
            }

            // 更新轮播位置
            function updatePosition() {
                track.style.transform = `translateX(-${currentIndex * cardWidth}px)`;
            }

            // 自动滚动
            function startAutoScroll() {
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                clearInterval(autoScrollInterval);
                autoScrollInterval = setInterval(() => {
                    nextSlide();
                }, 3000);
            }

            function resetAutoScroll() {
                clearInterval(autoScrollInterval);
                startAutoScroll();
            }

            // 下一张
            function nextSlide() {
                if(currentIndex >= sponsors.length - itemsPerView) {
                    currentIndex = 0;
                } else {
                    currentIndex++;
                }
                updatePosition();
            }

            // 上一张
            function prevSlide() {
                if(currentIndex <= 0) {
                    currentIndex = Math.max(0, sponsors.length - itemsPerView);
                } else {
                    currentIndex--;
                }
                updatePosition();
            }

            // 事件监听
            prevBtn.addEventListener('click', () => {
                prevSlide();
                resetAutoScroll();
            });

            nextBtn.addEventListener('click', () => {
                nextSlide();
                resetAutoScroll();
            });

            track.addEventListener('mouseenter', () => clearInterval(autoScrollInterval));
            track.addEventListener('mouseleave', startAutoScroll);
            track.addEventListener('focusin', () => clearInterval(autoScrollInterval));
            track.addEventListener('focusout', startAutoScroll);

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) clearInterval(autoScrollInterval);
                else startAutoScroll();
            });

            // 响应式调整
            window.addEventListener('resize', () => {
                updateItemsPerView();
                if(track.children.length > 0) {
                    cardWidth = track.children[0].offsetWidth + 12;
                }
                updatePosition();
            });

            // 初始化
            initCarousel();
        });
    </script>
    <footer>
         <p class="footer-text">
            🚀Copyright &copy; 2023 Made with <i class="fas fa-heart" style="color: #ff4757;"></i> in 
            <a href="https://github.com/SecNN" target="_blank">SecNN</a>
        </p>
    </footer>
    <script src="../assets/site-footer.js?v=1"></script>
</body>
</html>
